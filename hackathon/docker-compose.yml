# HTTPS-дополнение. Запускать из корня вместе с основным docker-compose.yml.
services:
  radar:
    command: ["uvicorn", "radar.public:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
  caddy:
    image: caddy:2-alpine
    environment:
      RADAR_HOST: ${RADAR_HOST:?Set RADAR_HOST in the root .env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./hackathon/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - radar
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
