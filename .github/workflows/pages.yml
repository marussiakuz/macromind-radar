name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tech-trend-searcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tech-trend-searcher/package-lock.json
      - run: npm ci
      # Типы проверяются той же командой, что и локально: сборка падает на ошибке типов.
      # RADAR_API — адрес публичного сервиса. Пока переменная не задана, страница
      # работает на вшитом прогоне и честно сообщает, что сервис недоступен.
      - run: npm run build
        env:
          VITE_RADAR_API: ${{ vars.RADAR_API }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tech-trend-searcher/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
